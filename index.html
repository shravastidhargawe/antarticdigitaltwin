<!DOCTYPE html>
<html lang="en" class="dark">
<head>

      darkMode: 'class',

        extend: {

              hover: '#2563eb',

              900: '#080d1a',
              850: '#0f182c',
              800: '#15223c',
              700: '#1a2744'

            mono: ['"JetBrains Mono"', 'monospace']

        }
      }
    }

  <!-- Custom Design Tokens & Styling -->
 <link rel="stylesheet" href="./styles.css">
